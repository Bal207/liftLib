name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '13.2.Rel1'

      - name: Build library and demo
        run: make -j$(nproc)

      - name: Fail on compiler warnings
        # The pretty-printer swallows warnings, so build once more with the
        # bare compiler output and reject anything that warns.
        run: |
          make clean
          make -j$(nproc) VERBOSE=1 2>&1 | tee build.log
          if grep -E "warning:|error:" build.log; then
            echo "::error::compiler emitted warnings or errors"
            exit 1
          fi
